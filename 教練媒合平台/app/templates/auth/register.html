{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-10 rounded-3xl shadow-xl border border-slate-100">
        <h1 class="text-3xl font-bold text-slate-800 mb-2 text-center">加入平台</h1>
        <p class="text-slate-400 text-center mb-8">開始您的運動發展之旅</p>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-6">
            <div>
                <label class="text-sm font-semibold text-slate-500 block mb-2">真實姓名</label>
                <input type="text" name="name" required placeholder="例如：王小明"
                    class="w-full p-4 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none transition">
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-500 block mb-2">電子郵件</label>
                <input type="email" name="email" required
                    class="w-full p-4 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none transition">
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-500 block mb-2">設定密碼</label>
                <input type="password" name="password" required
                    class="w-full p-4 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none transition">
            </div>

            <button type="submit" class="w-full py-4 btn-premium rounded-xl font-bold">
                確認註冊
            </button>
        </form>
    </div>
</div>
{% endblock %}
