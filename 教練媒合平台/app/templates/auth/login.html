{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-10 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100">
        <h1 class="text-3xl font-bold text-slate-800 mb-8 text-center">歡迎回來</h1>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="text-sm font-semibold text-slate-500 block mb-2">電子郵件</label>
                <input type="email" name="email" required
                    class="w-full p-4 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none transition">
            </div>
            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-500 block">密碼</label>
                </div>
                <input type="password" name="password" required
                    class="w-full p-4 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none transition">
            </div>

            <button type="submit" class="w-full py-4 btn-premium rounded-xl font-bold">
                登入平台
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-slate-50 text-center">
            <p class="text-slate-400 text-sm">還沒有帳號嗎？ <a href="/register" class="text-blue-600 font-bold">免費註冊</a>
            </p>
        </div>
    </div>

    <!-- Demo Info -->
    <div class="mt-8 p-6 bg-amber-50 border border-amber-100 rounded-[2rem] text-[10px] text-amber-700">
        <p class="font-black uppercase tracking-widest mb-3">系統測試帳號</p>
        <div class="space-y-4">
            <div>
                <p class="font-black text-amber-900 mb-1">👑 管理員帳號</p>
                <code class="bg-amber-100/50 px-2 py-0.5 rounded">admin@taiwan.com</code> / <code>admin123</code>
            </div>
            <div>
                <p class="font-black text-amber-900 mb-1">🏋️ 示範教練 (Fitness)</p>
                <code class="bg-amber-100/50 px-2 py-0.5 rounded">coach_1@example.com</code> / <code>password123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
